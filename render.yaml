services:
  - type: web
    name: swasthyasetu-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.lock.txt && python -m alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DEMO_MODE
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: minimaxai/minimax-m3.1-flash
      - key: NVIDIA_REASONING_EFFORT
        value: low
      - key: NVIDIA_MAX_TOKENS
        value: "16384"
      - key: EMBEDDING_PROVIDER
        value: nvidia
      - key: EMBEDDING_MODEL
        value: nvidia/nemotron-3.5-embed-1b
      - key: EMBEDDING_DIMENSIONS
        value: "2048"
      - key: EMBEDDING_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: CORS_ORIGINS
        sync: false
